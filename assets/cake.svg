    <!-- side of the slice -->
    <path d="M40 150 L180 96 L216 120 L216 196 L40 206 Z" fill="#ffe2b8"/>
    <!-- sponge layers -->
    <path d="M40 206 L40 150 L76 172 L76 228 Z" fill="#ffcf8a"/>
