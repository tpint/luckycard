  <g fill="#fff" opacity=".85">
    <circle cx="146" cy="74" r="3.5"/><circle cx="160" cy="68" r="3.5"/><circle cx="156" cy="86" r="3.5"/><circle cx="142" cy="90" r="3"/><circle cx="168" cy="84" r="3"/>
    <ellipse cx="96" cy="150" rx="18" ry="6" transform="rotate(-20 96 150)"/>
  </g>
</svg>
