<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- LuckyCard original art: strawberry cake slice -->
  <g stroke="#5b3a2e" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- side of the slice -->
    <path d="M40 150 L180 96 L216 120 L216 196 L40 206 Z" fill="#ffe2b8"/>
    <!-- sponge layers -->
    <path d="M40 206 L40 150 L76 172 L76 228 Z" fill="#ffcf8a"/>
    <path d="M76 172 L216 120 L216 196 L76 228 Z" fill="#ffd99e"/>
    <path d="M76 198 L216 158" fill="none" stroke="#ff7aa8" stroke-width="12"/>
    <!-- cream top -->
    <path d="M40 150 L180 96 L216 120 L76 172 Z" fill="#fff6ef"/>
    <path d="M76 172 Q96 186 112 168 Q130 182 146 160 Q164 172 180 150 Q198 160 216 140 L216 120 Z" fill="#fff6ef"/>
    <!-- cream dollop in the middle of the top, with the strawberry standing on it -->
    <ellipse cx="128" cy="136" rx="34" ry="13" fill="#fff6ef"/>
    <g transform="translate(128 140) scale(1.3) translate(-128 -140)" stroke-width="6.2">
      <path d="M128 142 C102 130 96 100 109 90 C118 83 138 83 147 90 C160 100 154 130 128 142 Z" fill="#ff4f6d"/>
      <path d="M107 92 L113 79 L121 87 L128 74 L135 87 L143 79 L149 92 Q128 99 107 92 Z" fill="#5fcf6a"/>
      <g fill="#fff" stroke="none" opacity=".85">
        <circle cx="118" cy="104" r="3.5"/><circle cx="138" cy="104" r="3.5"/><circle cx="128" cy="114" r="3.5"/><circle cx="118" cy="122" r="3"/><circle cx="138" cy="122" r="3"/><circle cx="128" cy="130" r="3"/>
        <path d="M112 100 Q114 94 120 92" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>
  </g>
  <g fill="#fff" opacity=".85">
    <ellipse cx="96" cy="150" rx="18" ry="6" transform="rotate(-20 96 150)"/>
  </g>
</svg>
