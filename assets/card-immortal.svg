<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 116">
  <!-- LuckyCard original art: immortal card back -->
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="7" cy="7" r="2.6" fill="rgba(255,255,255,.25)"/>
    </pattern>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3b6b"/><stop offset=".5" stop-color="#b44dff"/><stop offset="1" stop-color="#3bd1ff"/></linearGradient>
  </defs>
  <rect x="2" y="2" width="80" height="112" rx="10" fill="url(#rainbow)"/>
  <rect x="2" y="2" width="80" height="112" rx="10" fill="url(#dots)"/>
  <rect x="9" y="9" width="66" height="98" rx="6" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="5 4" opacity=".8"/>
  <g transform="translate(42 56)">
    <g fill="#7a2fc0" stroke="#7a2fc0" stroke-width="5"><circle cx="-8" cy="-8" r="9"/><circle cx="8" cy="-8" r="9"/><circle cx="-8" cy="8" r="9"/><circle cx="8" cy="8" r="9"/></g>
    <g fill="#fff"><circle cx="-8" cy="-8" r="9"/><circle cx="8" cy="-8" r="9"/><circle cx="-8" cy="8" r="9"/><circle cx="8" cy="8" r="9"/><circle r="7"/></g>
  </g>
</svg>
