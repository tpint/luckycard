<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#b98cf0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LuckyCard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #b07ff0;
    --purple-dark: #8a55d6;
    --purple-deep: #6a3bb5;
    --paper: #f4efe0;
    --paper-inner: #e7e6ea;
    --gold: #ffd84a;
    --ink: #3a2a55;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Baloo 2", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #8fc3ff 0%, #c9b8f5 35%, #d8b5f2 70%, #e6c2f5 100%);
    background-attachment: fixed;
    display: flex; justify-content: center;
    overflow-x: hidden;
    user-select: none; -webkit-user-select: none;
  }
  .app {
    width: 100%; max-width: 440px; min-height: 100%;
    padding: max(14px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px;
  }

  /* header */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px; }
  .title { font-size: 26px; font-weight: 800; color: #fff; text-shadow: 0 2px 0 rgba(60,30,110,.35); display: flex; align-items: center; gap: 6px; }
  .title .info { width: 26px; height: 26px; border-radius: 50%; background: var(--gold); color: var(--ink); font-size: 18px; display: grid; place-items: center; border: 2px solid var(--ink); }
  .bag { background: #2b2140; color: #fff; border-radius: 999px; padding: 4px 14px; font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 6px; transition: transform .2s; }
  .bag.bump { transform: scale(1.25); }

  /* main panel */
  .panel {
    background: var(--purple);
    border-radius: 28px 28px 22px 22px;
    padding: 10px 10px 14px;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.35), 0 6px 0 var(--purple-dark);
  }
  .rate { text-align: center; color: #fff; font-weight: 700; font-size: 18px; margin: 2px 0 8px; opacity: .95; }
  .prizes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .prize {
    position: relative; border-radius: 10px; padding: 4px 34px 6px 6px; min-height: 58px;
    display: flex; flex-direction: column; justify-content: center;
    transition: transform .25s, box-shadow .25s;
  }
  .prize:nth-child(1) { background: #ffe066; }
  .prize:nth-child(2) { background: #dfe8f2; }
  .prize:nth-child(3) { background: #efe2c6; }
  .prize .label { font-size: 13px; font-weight: 700; color: #c7552a; line-height: 1; }
  .prize:nth-child(2) .label { color: #5a6a80; }
  .prize:nth-child(3) .label { color: #8a7650; }
  .prize .slots { display: flex; gap: 0; font-size: 14px; margin-top: 3px; }
  .prize .slots span { filter: grayscale(1) opacity(.35); transition: filter .2s, transform .2s; }
  .prize .slots span.on { filter: none; transform: scale(1.15); }
  .prize .reward { position: absolute; right: -4px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(#5a3a8c, #2b1d48); border: 3px solid var(--purple-dark); display: grid; place-items: center; font-size: 18px; }
  .prize .reward b { position: absolute; right: -3px; bottom: -4px; background: #2b1d48; color: #fff; font-size: 11px; border-radius: 4px; padding: 0 4px; line-height: 15px; }
  .prize.hot { animation: wobble .5s ease-in-out infinite alternate; }
  .prize.won { box-shadow: 0 0 0 3px #fff, 0 0 18px 6px var(--gold); transform: scale(1.06); }
  @keyframes wobble { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }

  .hint { text-align: center; color: #fff; font-size: 14px; font-weight: 500; margin: 10px 0 8px; background: var(--purple-dark); border-radius: 12px; padding: 4px 8px; }
  .hint em { color: var(--gold); font-style: normal; font-weight: 700; }

  /* ticket */
  .ticket {
    background: var(--paper); border-radius: 12px; padding: 12px;
    border: 4px solid var(--paper); transition: border-color .3s;
    position: relative;
  }
  .ticket[data-type="rare"] { border-color: #5fa2f5; }
  .ticket[data-type="epic"] { border-color: #ff9a3c; }
  .ticket[data-type="legendary"] { border-color: #ffd23f; box-shadow: 0 0 14px rgba(255,210,63,.8); }
  .ticket[data-type="immortal"] {
    border-color: transparent;
    background: linear-gradient(var(--paper), var(--paper)) padding-box,
                linear-gradient(90deg, #ff3b6b, #b44dff, #3bd1ff, #ffd23f, #ff3b6b) border-box;
    background-size: 100% 100%, 300% 100%;
    animation: shimmer 2.5s linear infinite;
    box-shadow: 0 0 18px rgba(180,77,255,.8);
  }
  @keyframes shimmer { to { background-position: 0 0, 300% 0; } }
  .rarity {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%); z-index: 2;
    font-size: 13px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase;
    color: #fff; padding: 1px 12px; border-radius: 999px; border: 2px solid #fff;
    background: #5fa2f5; white-space: nowrap;
  }
  .ticket[data-type="epic"] .rarity { background: #ff9a3c; }
  .ticket[data-type="legendary"] .rarity { background: #f2b800; }
  .ticket[data-type="immortal"] .rarity { background: linear-gradient(90deg, #ff3b6b, #b44dff, #3bd1ff); }
  .ticket[data-type=""] .rarity { display: none; }
  .board {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;
    background: var(--paper-inner); border-radius: 8px; padding: 10px;
    touch-action: manipulation;
  }
  .tile { position: relative; aspect-ratio: 1; min-width: 0; }
  .tile .face {
    position: absolute; inset: 4%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #f1ecff);
    display: grid; place-items: center;
    font-size: clamp(26px, 9vw, 40px);
    box-shadow: inset 0 0 0 3px #d9d0ef;
  }
  .tile canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity .25s, transform .1s; }
  .tile.revealed canvas { opacity: 0; pointer-events: none; }
  .tile.revealed .face { animation: pop .3s ease-out; }
  .tile:not(.revealed) { cursor: pointer; }
  .tile:not(.revealed):active canvas { transform: scale(.92); }
  .tile.pair .face { box-shadow: inset 0 0 0 3px #ff8ad0, 0 0 10px #ff8ad0; }
  .tile.win .face { box-shadow: inset 0 0 0 4px var(--gold), 0 0 16px 4px var(--gold); animation: winpulse .6s ease-in-out infinite alternate; }
  .tile.dim { opacity: .45; }
  @keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes winpulse { from { transform: scale(1); } to { transform: scale(1.1); } }

  .empty {
    position: absolute; inset: 0; display: none; place-items: center; text-align: center;
    background: rgba(244,239,224,.92); border-radius: 8px; font-weight: 700; font-size: 18px; padding: 20px;
  }
  .ticket.no-card .empty { display: grid; }

  /* tray */
  .tray { display: flex; align-items: center; gap: 10px; }
  .cards { flex: 1; display: flex; gap: 4px; background: rgba(120,70,190,.35); border-radius: 10px; padding: 6px; min-height: 70px; overflow-x: auto; scrollbar-width: none; }
  .card { flex: 0 0 42px; height: 58px; border-radius: 6px; border: 2px solid #fff; background: #a576e6; display: grid; place-items: center; color: rgba(255,255,255,.7); font-size: 18px; }
  .card.rare { background: #5fa2f5; }
  .card.epic { background: #ff9a3c; }
  .card.legendary { background: #ffd23f; color: rgba(140,90,0,.6); box-shadow: 0 0 8px #ffd23f; }
  .card.immortal { background: linear-gradient(135deg, #ff3b6b, #b44dff, #3bd1ff); box-shadow: 0 0 10px #b44dff; color: #fff; }
  .cards .none { color: #fff; opacity: .8; font-size: 14px; align-self: center; padding-left: 6px; }
  .get {
    border: none; font: inherit; font-weight: 700; font-size: 16px; color: var(--ink);
    background: #fff; border-radius: 999px; padding: 8px 14px; box-shadow: 0 3px 0 #9c86c4;
    cursor: pointer;
  }
  .get:active { transform: translateY(2px); box-shadow: 0 1px 0 #9c86c4; }

  .bottom { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #5b4580; padding: 0 4px; }
  .stats { text-align: right; line-height: 1.3; }
  .reset { background: none; border: none; color: #5b4580; text-decoration: underline; font: inherit; cursor: pointer; padding: 0; }
  .version { opacity: .7; }

  /* win popup */
  .overlay {
    position: fixed; inset: 0; background: rgba(40,20,70,.55); display: none;
    place-items: center; z-index: 10; padding: 16px;
  }
  .overlay.show { display: grid; animation: fade .2s; }
  .popup {
    background: #fff; border-radius: 24px; padding: 22px 28px; text-align: center; width: min(320px, 100%);
    box-shadow: 0 8px 0 var(--purple-dark); animation: pop .35s ease-out;
  }
  .popup h2 { margin: 0; font-size: 30px; color: var(--purple-deep); }
  .popup .big { font-size: 56px; line-height: 1.2; }
  .popup p { margin: 4px 0 16px; font-size: 20px; font-weight: 700; }
  .popup button { border: none; font: inherit; font-weight: 800; font-size: 18px; color: #fff; background: var(--purple-dark); border-radius: 999px; padding: 10px 28px; box-shadow: 0 4px 0 var(--purple-deep); cursor: pointer; }
  @keyframes fade { from { opacity: 0; } }

  /* upgrade shop */
  .top-right { display: flex; align-items: center; gap: 8px; }
  .shop-btn {
    border: none; font: inherit; font-weight: 800; font-size: 15px; color: var(--ink);
    background: var(--gold); border-radius: 999px; padding: 4px 12px; box-shadow: 0 3px 0 #c9a21c; cursor: pointer;
  }
  .shop-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c9a21c; }
  .popup.shop { width: min(380px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; text-align: left; padding: 18px; }
  .shop-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .shop-head h2 { font-size: 26px; }
  .upgrade { display: flex; align-items: center; gap: 10px; background: #f3edfc; border-radius: 14px; padding: 8px 10px; margin-bottom: 8px; }
  .upgrade .icon { font-size: 28px; }
  .upgrade .info { flex: 1; min-width: 0; line-height: 1.25; }
  .upgrade .name { font-weight: 800; font-size: 16px; }
  .upgrade .name small { color: #8a7aa8; font-weight: 700; }
  .upgrade .effect { font-size: 13px; color: #5b4580; }
  .upgrade .effect b { color: var(--purple-deep); }
  .popup .upgrade button { font-size: 15px; padding: 6px 12px; white-space: nowrap; }
  .popup .upgrade button:disabled { background: #c9bfd9; box-shadow: 0 4px 0 #a99cbf; cursor: default; }
  .shop-note { font-size: 12px; color: #8a7aa8; margin: 2px 0 12px; }
  #shopClose { display: block; margin: 0 auto; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="title"><span class="info">!</span>LuckyCard</div>
    <div class="top-right">
      <button class="shop-btn" id="shopBtn">⬆ Upgrades</button>
      <div class="bag" id="bag">📜 <span id="bagCount">0</span></div>
    </div>
  </div>

  <div class="panel">
    <div class="rate">✦ 100% Win Rate ✦</div>
    <div class="prizes" id="prizes"></div>
    <div class="hint">Tap to open tiles. Find <em>3 matching patterns</em> to win the corresponding item.</div>
    <div class="ticket" id="ticket" data-type="">
      <div class="rarity" id="rarity"></div>
      <div class="board" id="board"></div>
      <div class="empty">No cards left.<br>Tap “Get Cards”!</div>
    </div>
  </div>

  <div class="tray">
    <div class="cards" id="cards"></div>
    <button class="get" id="getCards">🃏 Get Cards</button>
  </div>

  <div class="bottom">
    <div class="version">v0.6 <!-- bump on every push --></div>
    <div class="stats"><span id="stats"></span><br><button class="reset" id="reset">reset progress</button></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="popup">
    <div id="popRarity" style="font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.5px"></div>
    <h2 id="popTitle">1st Prize!</h2>
    <div class="big" id="popIcon">👑</div>
    <p id="popReward">📜 × 3</p>
    <button id="popBtn">Next card</button>
  </div>
</div>

<div class="overlay" id="shop">
  <div class="popup shop">
    <div class="shop-head"><h2>Upgrades</h2><div class="bag">📜 <span id="shopBag">0</span></div></div>
    <div id="upgrades"></div>
    <div class="shop-note">Rarity upgrades apply to new cards, not ones already in your tray.</div>
    <button id="shopClose">Close</button>
  </div>
</div>

<script>
// ---------- Tuning knobs (edit these to playtest different feels) ----------
const CONFIG = {
  tiles: 16,              // 4x4 grid
  startCards: 3,
  cardsPerRefill: 3,      // "Get Cards" is free in the prototype
  // How many of each losing pattern show up before the win (more 2s = more near-misses)
  loserCountWeights: [20, 35, 45], // weights for 0, 1, 2 copies
  // Chance of winning each prize (1st, 2nd, 3rd) on any card
  prizeOdds: [10, 30, 60],
  prizes: [
    { name: '1st Prize', icon: '👑', reward: 3 },
    { name: '2nd Prize', icon: '💧', reward: 2 },
    { name: '3rd Prize', icon: '🧤', reward: 1 },
  ],
  // Card rarity: drop chance (%) and reward multiplier
  rarities: {
    rare:      { label: 'Rare',      chance: 40, multiplier: 1 },
    epic:      { label: 'Epic',      chance: 30, multiplier: 2 },
    legendary: { label: 'Legendary', chance: 20, multiplier: 5 },
    immortal:  { label: 'Immortal',  chance: 10, multiplier: 20 },
  },
  // Upgrades bought with 📜. Cost of the next level = baseCost * costGrowth ^ currentLevel
  upgrades: {
    luck:  { name: 'Lucky Draw',    icon: '🍀', max: 10, baseCost: 20, costGrowth: 1.6,
             rarityBonus: { epic: 2, legendary: 2, immortal: 2 } }, // added to rarity weights per level
    crown: { name: 'Crown Chance',  icon: '👑', max: 5,  baseCost: 25, costGrowth: 1.7,
             prizeOddsBonus: [3, 3, -6] },                          // added to prizeOdds per level
    prize: { name: 'Bigger Prizes', icon: '📜', max: 5,  baseCost: 40, costGrowth: 1.8,
             rewardBonus: 1 },                                      // added to every prize's base reward per level
  },
};

// ---------- State ----------
const $ = id => document.getElementById(id);
const SAVE_KEY = 'luckycard';
const store = {
  get() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) } catch { return null } },
  set(v) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(v)) } catch {} },
};
const newSave = () => ({ bag: 0, cards: Array.from({ length: CONFIG.startCards }, () => randomRarity(0)), played: 0, wins: [0, 0, 0], upgrades: {} });
let save = store.get() || newSave();
save.upgrades = save.upgrades || {}; // saves from before upgrades existed

let round = null; // { rarity, winner, sequence, step, counts, done }

// ---------- Helpers ----------
function pickWeighted(weights) {
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < weights.length; i++) { if ((r -= weights[i]) < 0) return i; }
  return weights.length - 1;
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const lvl = id => save.upgrades[id] || 0;
const upgradeCost = id => Math.round(CONFIG.upgrades[id].baseCost * CONFIG.upgrades[id].costGrowth ** lvl(id));
function rarityWeights(luck = lvl('luck')) {
  const bonus = CONFIG.upgrades.luck.rarityBonus;
  return Object.keys(CONFIG.rarities).map(k => CONFIG.rarities[k].chance + (bonus[k] || 0) * luck);
}
function randomRarity(luck = lvl('luck')) {
  return Object.keys(CONFIG.rarities)[pickWeighted(rarityWeights(luck))];
}
const prizeOdds = (crown = lvl('crown')) => CONFIG.prizeOdds.map((o, i) => o + CONFIG.upgrades.crown.prizeOddsBonus[i] * crown);
const baseReward = (prize, bonus = lvl('prize')) => CONFIG.prizes[prize].reward + CONFIG.upgrades.prize.rewardBonus * bonus;
const rewardFor = (prize, rarity) => baseReward(prize) * (rarity ? CONFIG.rarities[rarity].multiplier : 1);

// The result is decided when the card starts (like the real game's "100% win rate").
// Whichever tile you open next shows the next symbol in this sequence,
// and the 3rd copy of the winning symbol is always the last one.
function buildSequence(winner) {
  const seq = [winner, winner];
  CONFIG.prizes.forEach((_, i) => {
    if (i === winner) return;
    const n = pickWeighted(CONFIG.loserCountWeights);
    for (let k = 0; k < n; k++) seq.push(i);
  });
  shuffle(seq);
  seq.push(winner);
  return seq;
}

// ---------- Sound + haptics ----------
let audio;
function tone(freq, dur = 0.08, type = 'sine', when = 0, vol = 0.15) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime + when;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
  } catch {}
}
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms) } catch {} };

// ---------- Rendering ----------
function renderPrizes() {
  const rarity = round && round.rarity;
  $('prizes').innerHTML = CONFIG.prizes.map((p, i) => `
    <div class="prize" data-i="${i}">
      <div class="label">${p.name}</div>
      <div class="slots">${`<span>${p.icon}</span>`.repeat(3)}</div>
      <div class="reward">📜<b>${rewardFor(i, rarity)}</b></div>
    </div>`).join('');
  updatePrizeSlots();
}
function updatePrizeSlots() {
  document.querySelectorAll('.prize').forEach((el, i) => {
    const n = round ? round.counts[i] : 0;
    el.querySelectorAll('.slots span').forEach((s, k) => s.classList.toggle('on', k < n));
    el.classList.toggle('hot', !!round && n === 2 && !round.done);
    el.classList.toggle('won', !!round && round.done && round.winner === i);
  });
}
function renderTray() {
  $('cards').innerHTML = save.cards.length
    ? save.cards.map(r => `<div class="card ${r}" title="${CONFIG.rarities[r].label}">✦</div>`).join('')
    : '<span class="none">No cards</span>';
}
const pcts = ws => { const sum = ws.reduce((a, b) => a + b, 0); return ws.map(w => Math.round(w / sum * 100)); };
// "now → next" for each value, or just "now" at max level
const change = (labels, now, next, unit = '') =>
  labels.map((l, i) => next ? `${l} ${now[i]}${unit}→<b>${next[i]}${unit}</b>` : `${l} <b>${now[i]}${unit}</b>`).join(' · ');
const upgradeEffects = {
  luck: next => change(Object.values(CONFIG.rarities).map(r => r.label), pcts(rarityWeights()), next && pcts(rarityWeights(lvl('luck') + 1)), '%'),
  crown: next => change(CONFIG.prizes.map(p => p.icon), pcts(prizeOdds()), next && pcts(prizeOdds(lvl('crown') + 1)), '%'),
  prize: next => 'Base 📜 ' + change(CONFIG.prizes.map(p => p.icon), CONFIG.prizes.map((_, i) => baseReward(i)), next && CONFIG.prizes.map((_, i) => baseReward(i, lvl('prize') + 1))),
};
function renderShop() {
  $('shopBag').textContent = save.bag;
  $('upgrades').innerHTML = Object.entries(CONFIG.upgrades).map(([id, u]) => {
    const maxed = lvl(id) >= u.max, cost = upgradeCost(id);
    return `
    <div class="upgrade">
      <div class="icon">${u.icon}</div>
      <div class="info">
        <div class="name">${u.name} <small>Lv ${lvl(id)}/${u.max}</small></div>
        <div class="effect">${upgradeEffects[id](!maxed)}</div>
      </div>
      <button data-id="${id}" ${maxed || save.bag < cost ? 'disabled' : ''}>${maxed ? 'MAX' : `📜 ${cost}`}</button>
    </div>`;
  }).join('');
}
function buyUpgrade(id) {
  const cost = upgradeCost(id);
  if (lvl(id) >= CONFIG.upgrades[id].max || save.bag < cost) return;
  save.bag -= cost;
  save.upgrades[id] = lvl(id) + 1;
  store.set(save);
  [523, 784].forEach((f, i) => tone(f, 0.12, 'triangle', i * 0.08, 0.15)); buzz(20);
  renderShop(); renderStats(); renderPrizes();
}

function renderStats() {
  $('bagCount').textContent = save.bag;
  $('stats').textContent = `Played ${save.played} · 👑${save.wins[0]} 💧${save.wins[1]} 🧤${save.wins[2]}`;
}

function drawCover(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth * dpr;
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const r = size * 0.46, c = size / 2;
  ctx.clearRect(0, 0, size, size);
  const grad = ctx.createRadialGradient(c * 0.8, c * 0.7, r * 0.1, c, c, r);
  grad.addColorStop(0, '#c9c9cf'); grad.addColorStop(1, '#a9a9b2');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(c, c, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#d6d6dc'; ctx.lineWidth = size * 0.04;
  ctx.beginPath(); ctx.arc(c, c, r * 0.82, 0, Math.PI * 2); ctx.stroke();
  ctx.save(); ctx.translate(c, c); ctx.rotate(-0.2);
  ctx.fillStyle = '#e4e4ea'; ctx.font = `800 ${size * 0.22}px "Baloo 2", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Lucky', 0, size * 0.04);
  ctx.restore();
}

function dealCard() {
  const board = $('board');
  board.innerHTML = '';
  if (!save.cards.length) {
    round = null;
    $('ticket').classList.add('no-card');
    $('ticket').dataset.type = '';
    renderPrizes();
    return;
  }
  $('ticket').classList.remove('no-card');
  const rarity = save.cards.shift();
  const winner = pickWeighted(prizeOdds());
  round = { rarity, winner, sequence: buildSequence(winner), step: 0, counts: [0, 0, 0], done: false };
  $('ticket').dataset.type = rarity;
  $('rarity').textContent = CONFIG.rarities[rarity].label;
  for (let i = 0; i < CONFIG.tiles; i++) {
    const t = document.createElement('div');
    t.className = 'tile';
    t.innerHTML = '<div class="face"></div><canvas></canvas>';
    board.appendChild(t);
  }
  requestAnimationFrame(() => board.querySelectorAll('canvas').forEach(drawCover));
  if (rarity === 'legendary' || rarity === 'immortal') {
    [523, 659, 784].forEach((f, i) => tone(f, 0.15, 'triangle', i * 0.07, 0.12)); buzz(40);
  }
  store.set(save);
  renderTray(); renderPrizes();
}

function reveal(tile) {
  const sym = round.sequence[round.step++];
  tile.dataset.sym = sym;
  tile.querySelector('.face').textContent = CONFIG.prizes[sym].icon;
  tile.classList.add('revealed');
  round.counts[sym]++;
  const n = round.counts[sym];
  tone(500 + n * 180, 0.12, 'triangle'); buzz(15);
  document.querySelectorAll(`.tile.revealed[data-sym="${sym}"]`).forEach(t => t.classList.toggle('pair', n === 2));
  if (n === 3) win(sym); else updatePrizeSlots();
}

function win(sym) {
  round.done = true;
  const p = CONFIG.prizes[sym];
  const reward = rewardFor(sym, round.rarity);
  document.querySelectorAll('.tile').forEach(t => {
    t.classList.remove('pair');
    if (+t.dataset.sym === sym && t.classList.contains('revealed')) t.classList.add('win');
    else t.classList.add('dim');
  });
  updatePrizeSlots();
  [660, 830, 990, 1320].forEach((f, i) => tone(f, 0.18, 'triangle', i * 0.09, 0.18)); buzz([30, 40, 60]);
  save.bag += reward; save.played++; save.wins[sym]++;
  store.set(save);
  setTimeout(() => {
    renderStats();
    $('bag').classList.add('bump'); setTimeout(() => $('bag').classList.remove('bump'), 250);
    $('popRarity').textContent = `${CONFIG.rarities[round.rarity].label} card`;
    $('popTitle').textContent = p.name + '!';
    $('popIcon').textContent = p.icon.repeat(3);
    $('popReward').textContent = `📜 × ${reward}`;
    $('popBtn').textContent = save.cards.length ? 'Next card' : 'OK';
    $('overlay').classList.add('show');
  }, 900);
}

// ---------- Input ----------
$('board').addEventListener('click', e => {
  if (!round || round.done) return;
  const tile = e.target.closest('.tile');
  if (!tile || tile.classList.contains('revealed')) return;
  reveal(tile);
});
$('popBtn').onclick = () => { $('overlay').classList.remove('show'); dealCard(); };
$('getCards').onclick = () => {
  for (let i = 0; i < CONFIG.cardsPerRefill; i++) save.cards.push(randomRarity());
  store.set(save); renderTray(); tone(700, 0.1, 'triangle');
  if (!round) dealCard();
};
$('shopBtn').onclick = () => { renderShop(); $('shop').classList.add('show'); };
$('shopClose').onclick = () => $('shop').classList.remove('show');
$('upgrades').addEventListener('click', e => {
  const btn = e.target.closest('button[data-id]');
  if (btn) buyUpgrade(btn.dataset.id);
});
$('reset').onclick = () => {
  if (!confirm('Reset all progress?')) return;
  save = newSave();
  store.set(save); $('overlay').classList.remove('show'); renderStats(); dealCard();
};
window.addEventListener('resize', () => {
  document.querySelectorAll('.tile:not(.revealed) canvas').forEach(drawCover);
});

renderStats(); renderTray(); renderPrizes();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(dealCard);
</script>
</body>
</html>
